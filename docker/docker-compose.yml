services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: content_factory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ../backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - db

  frontend:
    build: ../frontend
    ports:
      - "3000:3000"
    env_file:
      - ../.env

volumes:
  postgres_data:
